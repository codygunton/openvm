[package]
name = "openvm-test-vectors"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable revm_transfer vector generation (heavy, requires nightly + guest build).
revm-vectors = ["dep:openvm-sdk"]
# Forward CUDA to SDK and circuit for GPU-accelerated proving.
cuda = ["openvm-sdk?/cuda", "openvm-circuit/cuda"]

[dependencies]
openvm-stark-sdk.workspace = true
openvm-stark-backend.workspace = true
p3-baby-bear.workspace = true
p3-field.workspace = true
p3-poseidon2.workspace = true
p3-symmetric.workspace = true
p3-dft.workspace = true
p3-merkle-tree.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre.workspace = true

# Optional: for revm_transfer vector generation
openvm-sdk = { workspace = true, optional = true }

[dev-dependencies]
openvm-build.workspace = true
openvm-circuit = { workspace = true, features = ["test-utils"] }
openvm-rv32im-circuit = { workspace = true }
openvm-rv32im-transpiler = { workspace = true }
openvm-toolchain-tests = { workspace = true }
openvm-transpiler = { workspace = true }
openvm-instructions = { workspace = true }

[[test]]
name = "generate_revm_vectors"
required-features = ["revm-vectors"]
