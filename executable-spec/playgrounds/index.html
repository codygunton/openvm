<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenVM AIR Playgrounds</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-dim: #8b8fa7;
    --accent: #6c8cff;
    --green: #4ade80;
    --purple: #c084fc;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  body {
    font-family: var(--mono);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .landing {
    text-align: center;
    max-width: 700px;
    padding: 40px 24px;
  }

  h1 {
    font-size: 24px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 48px;
  }

  .subtitle a {
    color: var(--accent);
    text-decoration: none;
  }

  .subtitle a:hover { text-decoration: underline; }

  .doors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .door {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 28px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
  }

  .door:hover {
    background: var(--surface2);
    transform: translateY(-2px);
  }

  .door.examples:hover { border-color: var(--accent); }
  .door.production:hover { border-color: var(--green); }

  .door-icon {
    font-size: 36px;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .door h2 {
    font-size: 18px;
    margin-bottom: 10px;
  }

  .door.examples h2 { color: var(--accent); }
  .door.production h2 { color: var(--green); }

  .door p {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
    max-width: 240px;
  }

  @media (max-width: 600px) {
    .doors {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="landing">
  <h1>OpenVM AIR Playgrounds</h1>
  <div class="subtitle">
    Interactive explorers for the polynomial constraints in
    <a href="https://github.com/openvm-org/openvm">OpenVM</a>'s STARK proving system.
  </div>

  <div class="doors">
    <a class="door examples" href="examples.html">
      <div class="door-icon">//</div>
      <h2>Examples</h2>
      <p>Learn the building blocks of STARK proofs one concept at a time</p>
    </a>

    <a class="door production" href="production.html">
      <div class="door-icon">{}</div>
      <h2>Production</h2>
      <p>The complete AIR architecture that proves Ethereum transactions</p>
    </a>
  </div>
</div>

</body>
</html>
