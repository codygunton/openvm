[package]
name = "openvm-floats-circuit"
description = "OpenVM circuit extension for floating point arithmetic"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
openvm-stark-backend = { workspace = true }
openvm-stark-sdk = { workspace = true }
openvm-circuit-primitives = { workspace = true }
openvm-circuit-primitives-derive = { workspace = true }
openvm-circuit = { workspace = true }
openvm-circuit-derive = { workspace = true }
openvm-instructions = { workspace = true }
openvm-rv32im-circuit = { workspace = true }
openvm-floats-transpiler = { workspace = true }

strum.workspace = true
itertools.workspace = true
derive-new.workspace = true
derive_more = { workspace = true, features = ["from"] }
serde.workspace = true
rand.workspace = true

[dev-dependencies]
openvm-stark-sdk = { workspace = true }
openvm-circuit = { workspace = true, features = ["test-utils"] }
test-case = { workspace = true }

[features]
default = ["parallel"]
parallel = ["openvm-circuit/parallel"]
test-utils = ["openvm-circuit/test-utils"]
tco = []  # Tail-call optimization feature (currently unused but defined to silence warnings from derive macros)
